[project]
name = "local-ai-image-explorer"
version = "0.1.0"
description = "A lightweight local app for fast, iterative visual exploration with AI-generated images."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.2",
    "uvicorn[standard]>=0.30.5",
    "httpx>=0.27.2",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
]

[project.scripts]
local-ai-image-explorer = "app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local AI Image Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Fira+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="app-nav">
  <span class="logo">Local AI Image Explorer</span>
  <div class="nav-status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Ready</span>
  </div>
</header>

<div class="provider-warning" id="provider-warning" style="display:none">
  <span>⚠ AI provider unreachable at <code id="provider-url"></code></span>
  <button id="provider-dismiss" type="button">Dismiss</button>
</div>

<div class="app-body">

  <aside class="control-panel">
    <h2 class="panel-heading">Controls</h2>

    <div class="field">
      <label class="field-label" for="text-model">Text Model</label>
      <select id="text-model"><option value="">— loading —</option></select>
    </div>

    <div class="field">
      <label class="field-label" for="image-model">Image Model</label>
      <select id="image-model"><option value="">— loading —</option></select>
    </div>

    <div class="field">
      <label class="field-label" for="base-prompt">Base Prompt</label>
      <textarea id="base-prompt" placeholder="a lighthouse at dusk, oil painting"></textarea>
    </div>

    <div class="field">
      <label class="field-label" for="remix-phrases">Remix Phrases</label>
      <textarea id="remix-phrases" placeholder="one phrase per line"></textarea>
      <div class="field-hint">One per line — mixed into each new generation</div>
    </div>

    <hr class="divider">

    <div class="field-row">
      <div class="field">
        <label class="field-label" for="width">Width</label>
        <input id="width" type="number" value="512" step="64" min="64">
      </div>
      <div class="field">
        <label class="field-label" for="height">Height</label>
        <input id="height" type="number" value="512" step="64" min="64">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="seed">Seed</label>
      <input id="seed" type="text" placeholder="random">
    </div>

    <hr class="divider">

    <div class="field">
      <label class="field-label">Creativity</label>
      <div class="button-row" id="creativity-buttons">
        <button class="btn-ghost" data-level="mild" type="button">Mild</button>
        <button class="btn-ghost is-active" data-level="normal" type="button">Normal</button>
        <button class="btn-ghost" data-level="wild" type="button">Wild</button>
      </div>
    </div>

    <hr class="divider">

    <div class="button-row">
      <button class="btn-ghost" id="btn-pause" type="button" disabled>Pause</button>
      <button class="btn-ghost" id="btn-play" type="button">Play</button>
    </div>
  </aside>

  <main class="grid-panel">
    <h1 class="grid-heading">Explorations</h1>
    <div class="image-grid" id="image-grid"></div>
  </main>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" style="display:none">
  <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightbox-close" type="button">&times;</button>
    <img class="lightbox-image" id="lightbox-image" src="" alt="Generated image">
    <div class="lightbox-meta" id="lightbox-meta"></div>
    <div class="lightbox-actions">
      <button class="btn-ghost" id="lightbox-use-prompt" type="button">Use as Base Prompt</button>
      <button class="btn-ghost" id="lightbox-download" type="button">Download</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>

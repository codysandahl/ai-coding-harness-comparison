<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local AI Image Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Fira+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="logo">Image Explorer</span>
  </header>

  <div class="layout">
    <aside class="controls">
      <label>Text model <select id="textModel"></select></label>
      <label>Image model <select id="imageModel"></select></label>
      <label>Base prompt <textarea id="base" rows="3" placeholder="Start with a prompt"></textarea></label>
      <label>Remix phrases <span class="hint">one per line</span>
        <textarea id="remix" rows="5" placeholder="neon&#10;rain-soaked&#10;film grain"></textarea>
      </label>
      <label>Creativity <select id="creativity"></select></label>
      <div class="row">
        <label>Width <input id="width" type="number" min="64" step="64" value="1024"></label>
        <label>Height <input id="height" type="number" min="64" step="64" value="1024"></label>
      </div>
      <label>Seed <span class="hint">blank = random each image</span>
        <input id="seed" type="number" placeholder="random">
      </label>
      <button id="toggle" class="ghost">Start</button>
      <p id="error" class="error" role="alert"></p>
    </aside>

    <main>
      <p id="empty" class="empty">Generated images appear here. Click one to make its prompt the new base.</p>
      <section id="grid" class="grid"></section>
    </main>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-inner">
      <img id="lbImg" alt="">
      <dl id="lbMeta"></dl>
      <div class="lb-actions">
        <button id="lbDownload" class="ghost">Download</button>
        <button id="lbClose" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

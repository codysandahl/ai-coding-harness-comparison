<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local AI Image Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Fira+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #1A1A1A;
    --color-secondary: #666666;
    --color-tertiary: #8A8A8A;
    --color-neutral: #FFFFFF;
    --color-surface: #EEEEEE;
    --color-border: rgba(181, 181, 181, 0.3);

    --font-display: "Playfair Display", serif;
    --font-body: "Fira Sans", Arial, sans-serif;

    --space-3xs: 4px;
    --space-2xs: 8px;
    --space-xs: 12px;
    --space-sm: 16px;
    --space-md: 24px;
    --space-lg: 32px;
    --space-xl: 48px;
    --space-2xl: 64px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-surface);
    color: var(--color-primary);
    font-family: var(--font-body);
  }

  .app-nav {
    height: 72px;
    background: var(--color-neutral);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-lg);
  }

  .logo {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    font-variant: small-caps;
    color: var(--color-primary);
  }

  .nav-status {
    display: flex;
    align-items: center;
    gap: var(--space-2xs);
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-secondary);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 9999px;
    background: var(--color-primary);
  }

  .app-body {
    display: flex;
    align-items: flex-start;
    gap: var(--space-lg);
    padding: var(--space-lg);
    max-width: 1400px;
    margin: 0 auto;
  }

  .control-panel {
    flex: 0 0 300px;
    background: var(--color-neutral);
    padding: var(--space-lg);
  }

  .panel-heading {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.05em;
    margin: 0 0 var(--space-md);
  }

  .field {
    margin-bottom: var(--space-md);
  }

  .field-label {
    display: block;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-secondary);
    margin-bottom: var(--space-2xs);
  }

  .field-row {
    display: flex;
    gap: var(--space-sm);
  }

  .field-row .field {
    flex: 1;
    min-width: 0;
  }

  select,
  input[type="number"],
  input[type="text"],
  textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 1rem;
    color: var(--color-primary);
    background: var(--color-neutral);
    border: 1px solid var(--color-border);
    border-radius: 0;
    padding: var(--space-xs);
  }

  select:focus,
  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--color-primary);
  }

  textarea {
    resize: vertical;
    min-height: 72px;
    line-height: 1.65;
  }

  .field-hint {
    font-family: var(--font-body);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--color-tertiary);
    margin-top: var(--space-3xs);
  }

  .divider {
    height: 1px;
    background: var(--color-border);
    margin: var(--space-lg) 0;
    border: none;
  }

  .button-row {
    display: flex;
    gap: var(--space-sm);
  }

  .btn-ghost {
    flex: 1;
    background: transparent;
    color: var(--color-primary);
    border: 1px solid var(--color-primary);
    border-radius: 0;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: var(--space-xs) var(--space-md);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-ghost:hover,
  .btn-ghost.is-active {
    background: var(--color-primary);
    color: var(--color-neutral);
  }

  .grid-panel {
    flex: 1;
    min-width: 0;
  }

  .grid-heading {
    font-family: var(--font-display);
    font-size: 1.7rem;
    font-weight: 400;
    letter-spacing: -0.005em;
    margin: 0 0 var(--space-md);
  }

  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--space-lg) var(--space-md);
  }

  .card-post {
    background: var(--color-neutral);
    color: var(--color-primary);
  }

  .card-image {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-image .use-overlay {
    position: absolute;
    inset: 0;
    background: rgba(26, 26, 26, 0.82);
    color: var(--color-neutral);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    padding: var(--space-sm);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card-image:hover .use-overlay {
    opacity: 1;
  }

  .card-eyebrow {
    font-family: var(--font-body);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--color-tertiary);
    margin-top: var(--space-sm);
  }

  .card-prompt {
    font-family: var(--font-body);
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--color-secondary);
    margin-top: var(--space-3xs);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: var(--space-xl);
  }

  .lightbox.active {
    display: flex;
  }

  .lightbox-content {
    max-width: 90%;
    max-height: 90%;
    background: var(--color-neutral);
    padding: var(--space-lg);
    position: relative;
  }

  .lightbox-image {
    max-width: 100%;
    max-height: 70vh;
    display: block;
    margin-bottom: var(--space-md);
  }

  .lightbox-close {
    position: absolute;
    top: var(--space-sm);
    right: var(--space-sm);
    background: transparent;
    border: 1px solid var(--color-border);
    padding: var(--space-xs) var(--space-sm);
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .lightbox-metadata {
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--color-secondary);
    line-height: 1.6;
  }

  .lightbox-actions {
    margin-top: var(--space-md);
    display: flex;
    gap: var(--space-sm);
  }

  @media (max-width: 900px) {
    .app-body {
      flex-direction: column;
    }
    .control-panel {
      flex: 1 1 auto;
      width: 100%;
    }
  }
</style>
</head>
<body>

  <header class="app-nav">
    <span class="logo">Local AI Image Explorer</span>
    <div class="nav-status">
      <span class="status-dot"></span>
      <span id="status-text">Generating</span>
    </div>
  </header>

  <div class="app-body">

    <aside class="control-panel">
      <h2 class="panel-heading">Controls</h2>

      <div class="field">
        <label class="field-label" for="text-model">Text Model</label>
        <select id="text-model">
          <option>gpt-4o-mini</option>
          <option>gpt-3.5-turbo</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="image-model">Image Model</label>
        <select id="image-model">
          <option>dall-e-3</option>
          <option>dall-e-2</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="base-prompt">Base Prompt</label>
        <textarea id="base-prompt" placeholder="a lighthouse at dusk, oil painting"></textarea>
      </div>

      <div class="field">
        <label class="field-label" for="remix-phrases">Remix Phrases</label>
        <textarea id="remix-phrases" placeholder="one phrase per line"></textarea>
        <div class="field-hint">One per line — mixed into each new generation</div>
      </div>

      <hr class="divider">

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="width">Width</label>
          <input id="width" type="number" value="512" step="64">
        </div>
        <div class="field">
          <label class="field-label" for="height">Height</label>
          <input id="height" type="number" value="512" step="64">
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="seed">Seed</label>
        <input id="seed" type="text" placeholder="random">
      </div>

      <div class="field">
        <label class="field-label" for="creativity-level">Creativity Level</label>
        <select id="creativity-level">
          <option value="mild">Mild</option>
          <option value="normal" selected>Normal</option>
          <option value="wild">Wild</option>
        </select>
      </div>

      <hr class="divider">

      <div class="button-row">
        <button class="btn-ghost is-active" id="btn-pause" type="button">Pause</button>
        <button class="btn-ghost" id="btn-play" type="button">Play</button>
      </div>
    </aside>

    <main class="grid-panel">
      <h1 class="grid-heading">Explorations</h1>
      <div class="image-grid" id="image-grid"></div>
    </main>

  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightbox-close">&times; Close</button>
      <img class="lightbox-image" id="lightbox-image" src="" alt="">
      <div class="lightbox-metadata" id="lightbox-metadata"></div>
      <div class="lightbox-actions">
        <a class="btn-ghost" id="download-btn" href="#" download>Download</a>
      </div>
    </div>
  </div>

<script>
  // API base URL
  const API_BASE = window.location.origin;

  // Local state - all UI state is now client-side
  let localState = {
    running: false,
    paused: false,
    images: [],
    base_prompt: '',
    remix_phrases: '',
    creativity_level: 'normal',
    text_model: 'gpt-4o-mini',
    image_model: 'dall-e-3',
    width: 512,
    height: 512,
    seed: ''
  };

  // Initialize localState from actual input values on page load
  function initLocalState() {
    localState.base_prompt = document.getElementById("base-prompt").value;
    localState.remix_phrases = document.getElementById("remix-phrases").value;
    localState.text_model = document.getElementById("text-model").value;
    localState.image_model = document.getElementById("image-model").value;
    localState.width = parseInt(document.getElementById("width").value);
    localState.height = parseInt(document.getElementById("height").value);
    localState.seed = document.getElementById("seed").value;
    localState.creativity_level = document.getElementById("creativity-level").value;
  }

  let generationTask = null;  // Current async generation task
  let shouldStopGeneration = false;  // Signal to stop the generation loop

  // DOM elements
  const grid = document.getElementById("image-grid");
  const statusText = document.getElementById("status-text");
  const btnPause = document.getElementById("btn-pause");
  const btnPlay = document.getElementById("btn-play");
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightbox-image");
  const lightboxMetadata = document.getElementById("lightbox-metadata");
  const downloadBtn = document.getElementById("download-btn");

  // Initialize localState from actual input values on page load
  function initLocalState() {
    localState.base_prompt = document.getElementById("base-prompt").value;
    localState.remix_phrases = document.getElementById("remix-phrases").value;
    localState.text_model = document.getElementById("text-model").value;
    localState.image_model = document.getElementById("image-model").value;
    localState.width = parseInt(document.getElementById("width").value);
    localState.height = parseInt(document.getElementById("height").value);
    localState.seed = document.getElementById("seed").value;
    localState.creativity_level = document.getElementById("creativity-level").value;
  }

  // Load available models from API
  async function loadModels() {
    try {
      const response = await fetch(`${API_BASE}/api/models`);
      const data = await response.json();
      
      const textModels = [];
      const imageModels = [];
      
      for (const model of data.models) {
        const id = model.id.toLowerCase();
        if (id.includes('dall-e') || id.includes('image')) {
          imageModels.push(model.id);
        } else {
          textModels.push(model.id);
        }
      }
      
      if (textModels.length === 0) {
        textModels.push('gpt-4o-mini', 'gpt-3.5-turbo');
      }
      if (imageModels.length === 0) {
        imageModels.push('dall-e-3', 'dall-e-2');
      }
      
      populateSelect('text-model', textModels);
      populateSelect('image-model', imageModels);
      
    } catch (error) {
      console.error("Failed to load models:", error);
      populateSelect('text-model', ['gpt-4o-mini', 'gpt-3.5-turbo']);
      populateSelect('image-model', ['dall-e-3', 'dall-e-2']);
    }
  }
  
  function populateSelect(elementId, options) {
    const select = document.getElementById(elementId);
    select.innerHTML = '';
    options.forEach(option => {
      const el = document.createElement('option');
      el.value = option;
      el.textContent = option;
      select.appendChild(el);
    });
  }

  // Update UI from local state (no polling)
  function updateUI() {
    // Sync controls with local state
    document.getElementById("text-model").value = localState.text_model;
    document.getElementById("image-model").value = localState.image_model;
    document.getElementById("width").value = localState.width;
    document.getElementById("height").value = localState.height;
    document.getElementById("seed").value = localState.seed || "";
    document.getElementById("creativity-level").value = localState.creativity_level;
    document.getElementById("base-prompt").value = localState.base_prompt;
    document.getElementById("remix-phrases").value = localState.remix_phrases;

    // Update status
    if (localState.paused) {
      btnPause.classList.add("is-active");
      btnPlay.classList.remove("is-active");
      statusText.textContent = "Paused";
    } else if (localState.running) {
      btnPause.classList.remove("is-active");
      btnPlay.classList.add("is-active");
      statusText.textContent = "Generating";
    } else {
      btnPause.classList.remove("is-active");
      btnPlay.classList.remove("is-active");
      statusText.textContent = "Idle";
    }

    // Render images
    renderImages();
  }

  // Render image grid
  function renderImages() {
    grid.innerHTML = "";
    
    localState.images.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "card-post";
      
      const metadata = item.metadata;
      const base64Image = item.data;
      
      card.innerHTML = `
        <div class="card-image" onclick="openLightbox(${index})">
          <img src="data:image/png;base64,${base64Image}" alt="${metadata.prompt}">
          <div class="use-overlay">Use as Base Prompt</div>
        </div>
        <div class="card-eyebrow">
          ${metadata.model} · ${metadata.size[0]}×${metadata.size[1]} · seed ${metadata.seed} · ${metadata.creativity_level}
        </div>
        <div class="card-prompt">${metadata.prompt}</div>
      `;
      
      card.querySelector(".card-image").addEventListener("click", (e) => {
        e.stopPropagation();
        document.getElementById("base-prompt").value = metadata.prompt;
      });
      
      grid.appendChild(card);
    });
  }

  // Lightbox functions
  window.openLightbox = function(index) {
    const item = localState.images[index];
    if (!item) return;
    
    lightboxImage.src = `data:image/png;base64,${item.data}`;
    
    const date = new Date(item.metadata.timestamp * 1000);
    lightboxMetadata.innerHTML = `
      <strong>Prompt:</strong> ${item.metadata.prompt}<br>
      <strong>Model:</strong> ${item.metadata.model}<br>
      <strong>Size:</strong> ${item.metadata.size[0]}×${item.metadata.size[1]}<br>
      <strong>Seed:</strong> ${item.metadata.seed}<br>
      <strong>Creativity:</strong> ${item.metadata.creativity_level}<br>
      <strong>Generated:</strong> ${date.toLocaleString()}
    `;
    
    // Set download link
    downloadBtn.href = `data:image/png;base64,${item.data}`;
    downloadBtn.download = `image_${index}.png`;
    
    lightbox.classList.add("active");
  };

  function closeLightbox() {
    lightbox.classList.remove("active");
  }

  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  // Generate one image
  async function generateOneImage() {
    if (!localState.running || localState.paused) return;
    
    if (!localState.base_prompt.trim()) return;
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000); // 60s timeout
    
    try {
      const response = await fetch(`${API_BASE}/api/generation/produce`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          base_prompt: localState.base_prompt,
          remix_phrases: localState.remix_phrases.split('\n').filter(p => p.trim()),
          creativity_level: localState.creativity_level,
          model: localState.image_model,
          width: localState.width,
          height: localState.height,
          seed: localState.seed ? parseInt(localState.seed) : null
        }),
        signal: controller.signal
      });
      
      clearTimeout(timeoutId);
      
      if (!response.ok) {
        let errorDetail = response.statusText;
        try {
          const errorData = await response.json();
          errorDetail = errorData.detail || errorData.message || errorDetail;
        } catch (e) {
          // Could not parse JSON
        }
        console.error(`Generation failed: ${response.status} ${errorDetail}`);
        return;
      }
      
      const data = await response.json();
      localState.images.push({
        metadata: data.metadata,
        data: data.image
      });
      // Keep only last 20 images
      if (localState.images.length > 20) {
        localState.images = localState.images.slice(-20);
      }
      updateUI();
    } catch (error) {
      clearTimeout(timeoutId);
      if (error.name === 'AbortError') {
        console.error("Generation timed out");
      } else {
        console.error("Generation error:", error.message);
      }
    }
  }

  // The generation loop - runs continuously while running and not paused
  async function runGenerationLoop() {
    while (localState.running && !localState.paused) {
      // Wait before generating
      await new Promise(resolve => setTimeout(resolve, 8000));
      
      if (!localState.running || localState.paused) break;
      if (!localState.base_prompt.trim()) continue;
      
      // Generate one image
      await generateOneImage();
    }
  }

  // Start the generation loop
  function startGeneration() {
    if (localState.running && !localState.paused) return;
    
    localState.running = true;
    localState.paused = false;
    updateUI();
    
    // Start the async generation loop
    if (!generationTask) {
      generationTask = runGenerationLoop();
      // Clear task reference when done (only when running=false)
      generationTask.then(() => { generationTask = null; });
    }
  }

  // Pause the generation loop
  function pauseGeneration() {
    localState.running = false;
    localState.paused = true;
    updateUI();
    // The loop will exit on next iteration check
  }

  // Resume the generation loop
  function resumeGeneration() {
    localState.running = true;
    localState.paused = false;
    updateUI();
    
    // Restart if the previous task finished
    if (!generationTask) {
      generationTask = runGenerationLoop();
      generationTask.then(() => { generationTask = null; });
    }
  }

  // Event listeners for controls
  btnPause.addEventListener("click", () => {
    if (localState.running && !localState.paused) {
      pauseGeneration();
    } else {
      startGeneration();
    }
  });

  btnPlay.addEventListener("click", () => {
    if (!localState.running) {
      startGeneration();
    } else {
      resumeGeneration();
    }
  });

  // Update local state on input changes (no server sync needed)
  document.getElementById("base-prompt").addEventListener("change", () => {
    localState.base_prompt = document.getElementById("base-prompt").value;
    updateUI();
  });
  
  document.getElementById("remix-phrases").addEventListener("change", () => {
    localState.remix_phrases = document.getElementById("remix-phrases").value;
    updateUI();
  });
  
  document.getElementById("text-model").addEventListener("change", () => {
    localState.text_model = document.getElementById("text-model").value;
    updateUI();
  });
  
  document.getElementById("image-model").addEventListener("change", () => {
    localState.image_model = document.getElementById("image-model").value;
    updateUI();
  });
  
  document.getElementById("width").addEventListener("change", () => {
    localState.width = parseInt(document.getElementById("width").value);
    updateUI();
  });
  
  document.getElementById("height").addEventListener("change", () => {
    localState.height = parseInt(document.getElementById("height").value);
    updateUI();
  });
  
  document.getElementById("seed").addEventListener("change", () => {
    localState.seed = document.getElementById("seed").value;
    updateUI();
  });
  
  document.getElementById("creativity-level").addEventListener("change", () => {
    localState.creativity_level = document.getElementById("creativity-level").value;
    updateUI();
  });

  // Initialize
  loadModels();
  initLocalState();
  updateUI();

</script>

</body>
</html>

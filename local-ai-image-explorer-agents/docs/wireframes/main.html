<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local AI Image Explorer — Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Fira+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #1A1A1A;
    --color-secondary: #666666;
    --color-tertiary: #8A8A8A;
    --color-neutral: #FFFFFF;
    --color-surface: #EEEEEE;
    --color-border: rgba(181, 181, 181, 0.3);

    --font-display: "Playfair Display", serif;
    --font-body: "Fira Sans", Arial, sans-serif;

    --space-3xs: 4px;
    --space-2xs: 8px;
    --space-xs: 12px;
    --space-sm: 16px;
    --space-md: 24px;
    --space-lg: 32px;
    --space-xl: 48px;
    --space-2xl: 64px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-surface);
    color: var(--color-primary);
    font-family: var(--font-body);
  }

  /* ---------- Nav ---------- */
  .app-nav {
    height: 72px;
    background: var(--color-neutral);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-lg);
  }

  .logo {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    font-variant: small-caps;
    color: var(--color-primary);
  }

  .nav-status {
    display: flex;
    align-items: center;
    gap: var(--space-2xs);
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-secondary);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 9999px;
    background: var(--color-primary);
  }

  /* ---------- Shell ---------- */
  .app-body {
    display: flex;
    align-items: flex-start;
    gap: var(--space-lg);
    padding: var(--space-lg);
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ---------- Control panel ---------- */
  .control-panel {
    flex: 0 0 300px;
    background: var(--color-neutral);
    padding: var(--space-lg);
  }

  .panel-heading {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.05em;
    margin: 0 0 var(--space-md);
  }

  .field {
    margin-bottom: var(--space-md);
  }

  .field-label {
    display: block;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-secondary);
    margin-bottom: var(--space-2xs);
  }

  .field-row {
    display: flex;
    gap: var(--space-sm);
  }

  .field-row .field {
    flex: 1;
    min-width: 0;
  }

  select,
  input[type="number"],
  input[type="text"],
  textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 1rem;
    color: var(--color-primary);
    background: var(--color-neutral);
    border: 1px solid var(--color-border);
    border-radius: 0;
    padding: var(--space-xs);
  }

  select:focus,
  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--color-primary);
  }

  textarea {
    resize: vertical;
    min-height: 72px;
    line-height: 1.65;
  }

  .field-hint {
    font-family: var(--font-body);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--color-tertiary);
    margin-top: var(--space-3xs);
  }

  .divider {
    height: 1px;
    background: var(--color-border);
    margin: var(--space-lg) 0;
    border: none;
  }

  /* ---------- Ghost buttons ---------- */
  .button-row {
    display: flex;
    gap: var(--space-sm);
  }

  .btn-ghost {
    flex: 1;
    background: transparent;
    color: var(--color-primary);
    border: 1px solid var(--color-primary);
    border-radius: 0;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: var(--space-xs) var(--space-md);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-ghost:hover,
  .btn-ghost.is-active {
    background: var(--color-primary);
    color: var(--color-neutral);
  }

  /* ---------- Image grid panel ---------- */
  .grid-panel {
    flex: 1;
    min-width: 0;
  }

  .grid-heading {
    font-family: var(--font-display);
    font-size: 1.7rem;
    font-weight: 400;
    letter-spacing: -0.005em;
    margin: 0 0 var(--space-md);
  }

  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--space-lg) var(--space-md);
  }

  .card-post {
    background: var(--color-neutral);
    color: var(--color-primary);
  }

  .card-image {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }

  .card-image svg {
    width: 40px;
    height: 40px;
    stroke: var(--color-tertiary);
  }

  .card-image .use-overlay {
    position: absolute;
    inset: 0;
    background: rgba(26, 26, 26, 0.82);
    color: var(--color-neutral);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    padding: var(--space-sm);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card-image:hover .use-overlay {
    opacity: 1;
  }

  .card-eyebrow {
    font-family: var(--font-body);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--color-tertiary);
    margin-top: var(--space-sm);
  }

  .card-prompt {
    font-family: var(--font-body);
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--color-secondary);
    margin-top: var(--space-3xs);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  @media (max-width: 900px) {
    .app-body {
      flex-direction: column;
    }
    .control-panel {
      flex: 1 1 auto;
      width: 100%;
    }
  }
</style>
</head>
<body>

  <header class="app-nav">
    <span class="logo">Local AI Image Explorer</span>
    <div class="nav-status">
      <span class="status-dot"></span>
      <span>Generating</span>
    </div>
  </header>

  <div class="app-body">

    <aside class="control-panel">
      <h2 class="panel-heading">Controls</h2>

      <div class="field">
        <label class="field-label" for="text-model">Text Model</label>
        <select id="text-model">
          <option>gpt-4o-mini</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="image-model">Image Model</label>
        <select id="image-model">
          <option>dall-e-3</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="base-prompt">Base Prompt</label>
        <textarea id="base-prompt" placeholder="a lighthouse at dusk, oil painting">a lighthouse at dusk, oil painting</textarea>
      </div>

      <div class="field">
        <label class="field-label" for="remix-phrases">Remix Phrases</label>
        <textarea id="remix-phrases" placeholder="one phrase per line">dramatic clouds&#10;golden hour&#10;storm approaching</textarea>
        <div class="field-hint">One per line — mixed into each new generation</div>
      </div>

      <hr class="divider">

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="width">Width</label>
          <input id="width" type="number" value="512" step="64">
        </div>
        <div class="field">
          <label class="field-label" for="height">Height</label>
          <input id="height" type="number" value="512" step="64">
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="seed">Seed</label>
        <input id="seed" type="text" placeholder="random">
      </div>

      <hr class="divider">

      <div class="button-row">
        <button class="btn-ghost is-active" id="btn-pause" type="button">Pause</button>
        <button class="btn-ghost" id="btn-play" type="button">Play</button>
      </div>
    </aside>

    <main class="grid-panel">
      <h1 class="grid-heading">Explorations</h1>
      <div class="image-grid" id="image-grid"></div>
    </main>

  </div>

<script>
  const samplePrompts = [
    "a lighthouse at dusk, oil painting, dramatic clouds",
    "a lighthouse at dusk, oil painting, golden hour",
    "a lighthouse at dusk, oil painting, storm approaching",
    "a lighthouse at dusk, oil painting, calm harbor, dramatic clouds",
    "a lighthouse at dusk, oil painting, golden hour, distant sailboat",
    "a lighthouse at dusk, oil painting, storm approaching, crashing waves"
  ];

  const grid = document.getElementById("image-grid");

  samplePrompts.forEach((prompt, i) => {
    const card = document.createElement("div");
    card.className = "card-post";
    card.innerHTML = `
      <div class="card-image">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="0"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
        <div class="use-overlay">Use as Base Prompt</div>
      </div>
      <div class="card-eyebrow">Image ${i + 1} · dall-e-3 · 512×512 · seed ${482130 + i * 7}</div>
      <div class="card-prompt">${prompt}</div>
    `;
    card.querySelector(".card-image").addEventListener("click", () => {
      document.getElementById("base-prompt").value = prompt;
    });
    grid.appendChild(card);
  });

  const btnPause = document.getElementById("btn-pause");
  const btnPlay = document.getElementById("btn-play");
  const status = document.querySelector(".nav-status span:last-child");

  btnPause.addEventListener("click", () => {
    btnPause.classList.add("is-active");
    btnPlay.classList.remove("is-active");
    status.textContent = "Paused";
  });
  btnPlay.addEventListener("click", () => {
    btnPlay.classList.add("is-active");
    btnPause.classList.remove("is-active");
    status.textContent = "Generating";
  });
</script>

</body>
</html>

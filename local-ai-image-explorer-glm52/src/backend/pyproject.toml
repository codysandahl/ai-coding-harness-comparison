[project]
name = "local-ai-image-explorer"
version = "0.1.0"
description = "Fast, iterative local exploration of AI-generated images."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[tool.uv]
# uv syncs a .venv in this directory automatically; no manual venv creation.